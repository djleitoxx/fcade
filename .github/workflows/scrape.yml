name: Fightcade scraper

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 min (GitHub puede demorarlo un poco en horas pico)
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write             # necesario para que el workflow pueda commitear el JSON

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar librerias necesarias para Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev libasound2t64 || \
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev libasound2

      # Edita esta linea para agregar mas usuarios, separados por coma:
      # run: node scrape.js djleitox,oscarking
      - name: Correr el scraper
        run: node scrape.js djleitox

      - name: Commitear los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Actualizar datos de Fightcade"
          git push
